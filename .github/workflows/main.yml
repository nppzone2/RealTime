name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sắp xếp file vào đúng thư mục Android
        run: |
          set -e
          J=app/src/main/java/vn/minh/giochuan
          R=app/src/main/res
          mkdir -p $J $R/values $R/drawable $R/mipmap-anydpi-v26
          for f in *.java; do
            if [ -f "$f" ]; then mv "$f" $J/; fi
          done
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/; fi
          for f in colors strings styles; do
            if [ -f "$f.xml" ]; then mv "$f.xml" $R/values/; fi
          done
          if [ -f ic_launcher_foreground.xml ]; then mv ic_launcher_foreground.xml $R/drawable/; fi
          if [ -f ic_launcher.xml ]; then mv ic_launcher.xml $R/mipmap-anydpi-v26/; fi

          cat > settings.gradle <<'EOT'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "RealTime"
          include ':app'
          EOT

          cat > build.gradle <<'EOT'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOT

          cat > gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOT

          cat > app/build.gradle <<'EOT'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'vn.minh.giochuan'
              compileSdk 34
              defaultConfig {
                  applicationId 'vn.minh.giochuan'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              signingConfigs {
                  release {
                      storeFile file('giochuan.jks')
                      storePassword 'giochuan2026'
                      keyAlias 'giochuan'
                      keyPassword 'giochuan2026'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOT

          # Khoá ký app cố định, để các bản sau cài đè lên bản cũ được
          echo "" | base64 -d > app/giochuan.jks

          echo "Cấu trúc sau khi sắp xếp:"
          find app -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Đổi tên file
        run: cp app/build/outputs/apk/release/app-release.apk RealTime.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RealTime-APK
          path: RealTime.apk

      - name: Đăng lên mục Releases (link tải cố định)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RealTime v1.0.${{ github.run_number }}
          files: RealTime.apk
          make_latest: true
