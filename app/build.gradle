plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.minh.giochuan'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.minh.giochuan'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('giochuan.jks')
            storePassword 'giochuan2026'
            keyAlias 'giochuan'
            keyPassword 'giochuan2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
